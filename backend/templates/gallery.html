<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | MPSC IT CLUB</title>
    <link rel="icon" type="image/jpeg" href="https://scontent.cdninstagram.com/v/t51.2885-19/455707082_489548463706836_6164801201053764178_n.jpg?_nc_cat=111&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy41MDAuQzMifQ%3D%3D&_nc_ohc=48d9Yn9vURoQ7kNvwFd-3tA&_nc_oc=Adr_H8iB-xjLSx2NJ4VlwXpcXKkgsY7MxncJnkO0FknjjVcu5uOXnPlZDbJ2y8sJ6u8&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_ss=7baaf&oh=00_AQCy3HT7xaZ433Z5jeSqEjKlHVX9xD9HDBmzFnAbNMOOTw&oe=6A4ACBA2">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <style>
        .final-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .final-gallery-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.4s ease;
            height: 320px;
            animation: cardReveal 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .final-gallery-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--emerald-green);
            box-shadow: 0 15px 40px var(--glow-green);
        }

        .final-gallery-img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            transition: transform 0.6s ease;
        }

        .final-gallery-card:hover .final-gallery-img { transform: scale(1.08); }

        .final-caption-box {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 30px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 50%, transparent 100%);
            color: white; pointer-events: none;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .final-gallery-card:hover .final-caption-box { transform: translateY(0); }

        .final-caption-title {
            margin: 0; font-size: 0.95rem; color: #fff; font-weight: 500; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis;
        }

        .final-caption-sub {
            margin: 8px 0 0; font-size: 0.75rem;
            color: var(--emerald-green); text-transform: uppercase; letter-spacing: 1px;
        }

        /* Lightbox */
        .final-lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.98); z-index: 99999;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s ease;
        }
        .final-lightbox.show { opacity: 1; }

        .final-lightbox-inner {
            max-width: 90%; max-height: 90vh; position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center;
        }
        .final-lightbox.show .final-lightbox-inner { transform: scale(1); }

        .final-lightbox-img {
            max-width: 100%; max-height: 80vh; border-radius: 12px;
            box-shadow: 0 0 50px var(--glow-green);
            border: 1px solid rgba(0, 245, 180, 0.3);
        }

        .final-lightbox-text {
            margin-top: 16px; color: #fff; font-size: 1rem;
            letter-spacing: 1.5px; text-transform: uppercase; text-align: center; padding: 0 16px;
        }

        .final-close-btn {
            position: absolute; top: -40px; right: 0;
            color: #fff; font-size: 40px; cursor: pointer; line-height: 1; transition: color 0.2s;
        }
        .final-close-btn:hover { color: var(--emerald-green); }

        /* ── Swipe hint bar for mobile lightbox ── */
        .swipe-hint {
            display: none;
            margin-top: 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .final-gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px; padding: 10px 0;
            }
            .final-gallery-card { height: 190px; border-radius: 10px; }

            /* Always show caption on touch — no hover needed */
            .final-caption-box {
                transform: translateY(0);
                padding: 18px 10px 10px;
            }
            .final-caption-title { font-size: 0.72rem; -webkit-line-clamp: 2; }
            .final-caption-sub  { font-size: 0.62rem; margin-top: 3px; }

            /* Lightbox */
            .final-lightbox-inner { max-width: 96%; }
            .final-lightbox-img   { max-height: 65vh; border-radius: 8px; }
            .final-lightbox-text  { font-size: 0.85rem; }
            .final-close-btn      { top: -34px; font-size: 30px; }
            .swipe-hint           { display: block; }
        }

        @media (max-width: 400px) {
            .final-gallery-grid { grid-template-columns: 1fr; gap: 12px; }
            .final-gallery-card { height: 230px; }
            .final-caption-box  { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="futuristic-grid"></div>
    {% include 'components/navbar.html' %}

    <header class="page-header">
        <div class="container">
            <h1 class="hero-title">Visual Archive</h1>
            <p class="hero-subtitle">Exploring our legacy, one memory at a time.</p>
        </div>
    </header>

    <section class="gallery-section" style="padding-bottom: 5rem;">
        <div class="container">
            <div id="gallery-container" class="final-gallery-grid">
                <!-- Javascript will inject cards here -->
            </div>
        </div>
    </section>

    <!-- The Lightbox -->
    <div id="gallery-lightbox" class="final-lightbox" onclick="closeLightbox()">
        <div class="final-lightbox-inner" onclick="event.stopPropagation()">
            <span class="final-close-btn" onclick="closeLightbox()">&times;</span>
            <img id="lightbox-image" class="final-lightbox-img" src="">
            <div id="lightbox-title" class="final-lightbox-text"></div>
            <p class="swipe-hint">↓ SWIPE DOWN TO CLOSE</p>
        </div>
    </div>

    {% include 'components/footer.html' %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/circularMenu.js') }}"></script>
    <script>
        async function fetchAndRenderGallery() {
            const container = document.getElementById('gallery-container');
            
            try {
                const res = await fetch('/user/gallery_list');
                const images = await res.json();

                if (images.length === 0) {
                    container.innerHTML = '<p style="color: var(--emerald-green); grid-column: 1/-1; text-align: center;">The gallery is empty right now.</p>';
                    return;
                }

                container.innerHTML = ''; // Clear

                images.forEach((img, index) => {
                    // Create card element
                    const card = document.createElement('div');
                    card.className = 'final-gallery-card';
                    
                    // Stagger animation delay based on index
                    card.style.animationDelay = `${index * 0.1}s`;

                    card.innerHTML = `
                        <img src="${img.url}" class="final-gallery-img" alt="${img.caption}">
                        <div class="final-caption-box">
                            <h3 class="final-caption-title">${img.caption || 'MPSC IT CLUB'}</h3>
                            <p class="final-caption-sub">${img.category || 'Event'}</p>
                        </div>
                    `;

                    card.onclick = () => openLightbox(img.url, img.caption);
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Gallery Error:", err);
                container.innerHTML = '<p style="color: red; grid-column: 1/-1; text-align: center;">Error loading images. Please check console.</p>';
            }
        }

        function openLightbox(url, caption) {
            const lb = document.getElementById('gallery-lightbox');
            document.getElementById('lightbox-image').src = url;
            document.getElementById('lightbox-title').innerText = caption || 'MPSC IT CLUB';
            lb.style.display = 'flex';
            setTimeout(() => lb.classList.add('show'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('gallery-lightbox');
            lb.classList.remove('show');
            setTimeout(() => { lb.style.display = 'none'; document.body.style.overflow = 'auto'; }, 300);
        }

        // Swipe down to close on mobile
        let touchStartY = 0;
        document.getElementById('gallery-lightbox').addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        document.getElementById('gallery-lightbox').addEventListener('touchend', e => {
            if (e.changedTouches[0].clientY - touchStartY > 80) closeLightbox();
        }, { passive: true });

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchAndRenderGallery);
        
        // Escape key to close lightbox
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
