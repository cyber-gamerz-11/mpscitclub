<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC Panel | MPSC IT CLUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <style>
        .ec-category-section { margin-bottom: 4rem; }
        .ec-category-title { color: var(--emerald-green); font-size: 1.8rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .ec-scroll-container { display: flex; overflow-x: auto; gap: 2rem; padding-bottom: 1.5rem; scroll-snap-type: x mandatory; }
        .ec-scroll-container::-webkit-scrollbar { height: 8px; }
        .ec-scroll-container::-webkit-scrollbar-thumb { background: var(--emerald-green); border-radius: 4px; }
        .ec-scroll-container::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
        
        .ec-card { 
            flex: 0 0 260px; /* Scaled down width */
            scroll-snap-align: start;
            text-align: center; 
            padding: 2rem 1.5rem; /* Scaled down padding */
            transition: 0.5s; 
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            opacity: 1 !important;
        }
        .ec-card:hover { 
            transform: translateY(-10px); /* Subtle lift */
            border-color: var(--emerald-green);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
        }
        .ec-photo { 
            width: 140px; /* Scaled down photo */
            height: 140px; 
            border-radius: 50%; 
            border: 2px solid var(--emerald-green); 
            margin: 0 auto 1.2rem; 
            overflow: hidden;
            box-shadow: 0 0 15px var(--emerald-green);
            background: #111;
        }
        .ec-photo img { width: 100%; height: 100%; object-fit: cover; }
        .social-links { margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem; }
        .social-links a { 
            color: var(--white); 
            text-decoration: none; 
            font-size: 0.8rem; 
            padding: 5px 12px; 
            border-radius: 20px; 
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }
        .social-links a:hover { background: var(--emerald-green); color: var(--matte-black); border-color: var(--emerald-green); }

        /* Skeleton Animation */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.05) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.05) 75%) !important;
            background-size: 200% 100% !important;
            animation: skeleton-loading 1.5s infinite linear !important;
            border-color: transparent !important;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .ec-photo img {
            width: 100%; height: 100%; object-fit: cover;
            display: block;
        }

        /* Right Side Floating Timeline */
        .ec-timeline-container {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            padding: 1.5rem 0.8rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        
        .timeline-dot-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            width: 32px;
            height: 32px;
        }

        .timeline-year-label {
            position: absolute;
            right: 45px;
            background: rgba(0, 0, 0, 0.85);
            color: var(--white);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0;
            transform: translateX(10px);
            pointer-events: none;
            transition: all 0.3s ease;
            white-space: nowrap;
            border: 1px solid var(--glass-border);
        }

        .timeline-dot-wrapper:hover .timeline-year-label {
            opacity: 1;
            transform: translateX(0);
        }

        .timeline-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .timeline-dot-wrapper:hover .timeline-dot {
            background: var(--white);
            transform: scale(1.2);
            box-shadow: 0 0 10px var(--white);
        }

        .timeline-dot-wrapper.active .timeline-dot {
            background: var(--emerald-green);
            transform: scale(1.4);
            box-shadow: 0 0 15px var(--emerald-green);
        }
        
        .timeline-dot-wrapper.active .timeline-year-label {
            color: var(--emerald-green);
            border-color: var(--emerald-green);
            opacity: 1;
            transform: translateX(0);
        }

        /* Responsive timeline */
        @media (max-width: 991px) {
            .ec-timeline-container {
                position: sticky;
                top: 75px; /* Directly below sticky navigation */
                right: auto;
                left: 0;
                transform: none;
                flex-direction: row;
                width: 100%;
                justify-content: center;
                border-radius: 0;
                border: none;
                border-bottom: 1px solid var(--glass-border);
                background: rgba(10, 10, 10, 0.95);
                padding: 0.8rem;
                gap: 1.5rem;
                margin-bottom: 2rem;
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            }
            .timeline-year-label {
                position: static;
                opacity: 1;
                transform: none;
                pointer-events: auto;
                background: transparent;
                border: none;
                padding: 0;
                font-size: 0.95rem;
                color: var(--soft-gray);
            }
            .timeline-dot-wrapper {
                width: auto;
                height: auto;
                flex-direction: column-reverse;
                gap: 4px;
            }
            .timeline-dot {
                width: 8px;
                height: 8px;
            }
            .timeline-dot-wrapper.active .timeline-year-label {
                color: var(--emerald-green);
                font-weight: 700;
            }
        }
    </style>
</head>
<body>
    <div class="futuristic-grid"></div>
    <div class="cursor-glow" id="cursor-glow"></div>

    {% include 'components/navbar.html' %}

    <header class="page-header">
        <div class="container">
            <h1 class="hero-title">Executive Committee</h1>
            <p class="hero-subtitle">The visionaries leading MPSC IT CLUB towards excellence.</p>
        </div>
    </header>

    <div class="ec-timeline-container" id="ec-timeline">
        <!-- Dots loaded dynamically -->
    </div>

    <section class="ec-section" style="padding-top: 4rem; padding-bottom: 5rem;">
        <div class="container">
            <div id="ec-container">
                <!-- Data loaded via API -->
            </div>
        </div>
    </section>

    {% include 'components/footer.html' %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/circularMenu.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('ec-container');
            
            // Show Skeletons instantly
            container.innerHTML = `
                <div class="ec-category-section">
                    <h2 class="ec-category-title skeleton" style="width: 300px; height: 35px; border: none; border-radius: 4px;"></h2>
                    <div class="ec-scroll-container">
                        ${Array(4).fill('<div class="glass-card ec-card skeleton" style="height: 400px; border-radius: 16px;"></div>').join('')}
                    </div>
                </div>
            `;

            const res = await fetch('/user/ec_list');
            const members = await res.json();

            if (members.length === 0) {
                container.innerHTML = '<p>The committee list is being updated.</p>';
                return;
            }

            // Group by Year
            const yearsMap = {};
            members.forEach(m => {
                const yr = m.year || '2026';
                if (!yearsMap[yr]) {
                    yearsMap[yr] = [];
                }
                yearsMap[yr].push(m);
            });

            const categories = { 
                BVB: 'Bangla Version Boys (BVB)', 
                BVG: 'Bangla Version Girls (BVG)', 
                EVB: 'English Version Boys (EVB)', 
                EVG: 'English Version Girls (EVG)' 
            };

            const sortedYears = Object.keys(yearsMap).sort((a, b) => b - a);

            // Render Timeline
            const timeline = document.getElementById('ec-timeline');
            if (timeline) {
                timeline.innerHTML = sortedYears.map((yr, idx) => `
                    <div class="timeline-dot-wrapper ${idx === 0 ? 'active' : ''}" data-year="${yr}" onclick="scrollToYear('${yr}')">
                        <span class="timeline-year-label">${yr}</span>
                        <div class="timeline-dot"></div>
                    </div>
                `).join('');
            }

            let html = '';
            sortedYears.forEach(yr => {
                const yrMembers = yearsMap[yr];
                const grouped = { BVB: [], BVG: [], EVB: [], EVG: [] };

                yrMembers.forEach(m => {
                    if (grouped[m.category]) {
                        grouped[m.category].push(m);
                    }
                });

                let yearHtml = `
                    <div class="ec-year-section" id="year-section-${yr}" style="margin-bottom: 6rem; position: relative;">
                        <h2 class="year-heading" style="font-size: 2.8rem; color: var(--emerald-green); text-align: center; margin-bottom: 3rem; font-weight: 700; letter-spacing: 3px; text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);"><span style="color:var(--white);">Committee of</span> ${yr}</h2>
                `;

                for (const [key, title] of Object.entries(categories)) {
                    if (grouped[key].length > 0) {
                        yearHtml += `
                            <div class="ec-category-section">
                                <h3 class="ec-category-title">${title}</h3>
                                <div class="ec-scroll-container">
                                    ${grouped[key].map(m => `
                                        <div class="glass-card ec-card">
                                            <div class="ec-photo">
                                                <img src="${m.image_path || '/static/assets/images/ec/default.jpg'}" alt="${m.name}">
                                            </div>
                                            <h3 class="emerald" style="text-transform: uppercase; letter-spacing: 2px;">${m.name}</h3>
                                            <p class="role" style="color: var(--soft-gray); font-weight: 600;">${m.designation}</p>
                                            
                                            <div class="social-links" style="flex-wrap: wrap;">
                                                ${m.facebook ? `<a href="${m.facebook}" target="_blank">Facebook</a>` : ''}
                                                ${m.instagram ? `<a href="${m.instagram}" target="_blank">Instagram</a>` : ''}
                                                ${m.website ? `<a href="${m.website}" target="_blank">Website</a>` : ''}
                                                ${m.whatsapp ? `<a href="https://wa.me/${m.whatsapp.replace(/[^0-9]/g, '')}" target="_blank">WhatsApp</a>` : ''}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                }
                yearHtml += `</div>`;
                html += yearHtml;
            });

            container.innerHTML = html;

            gsap.from('.ec-year-section', { 
                opacity: 0, 
                y: 50, 
                stagger: 0.3, 
                duration: 1, 
                ease: "power3.out",
                clearProps: "all" 
            });

            setupTimelineHighlighting(sortedYears);
        });

        window.scrollToYear = (year) => {
            const section = document.getElementById(`year-section-${year}`);
            if (section) {
                const yOffset = -120; // Scroll offset to clear headers
                const y = section.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        };

        function setupTimelineHighlighting(years) {
            window.addEventListener('scroll', () => {
                let currentActive = years[0];
                let minDiff = Infinity;
                
                years.forEach(yr => {
                    const section = document.getElementById(`year-section-${yr}`);
                    if (section) {
                        const rect = section.getBoundingClientRect();
                        const diff = Math.abs(rect.top - 150);
                        if (diff < minDiff) {
                            minDiff = diff;
                            currentActive = yr;
                        }
                    }
                });

                document.querySelectorAll('.timeline-dot-wrapper').forEach(dot => {
                    if (dot.getAttribute('data-year') === currentActive) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            });
        }
    </script>
</body>
</html>
