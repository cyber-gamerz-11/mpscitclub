<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC Panel | MPSC IT CLUB</title>
    <link rel="icon" type="image/jpeg" href="https://scontent.cdninstagram.com/v/t51.2885-19/455707082_489548463706836_6164801201053764178_n.jpg?_nc_cat=111&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy41MDAuQzMifQ%3D%3D&_nc_ohc=48d9Yn9vURoQ7kNvwFd-3tA&_nc_oc=Adr_H8iB-xjLSx2NJ4VlwXpcXKkgsY7MxncJnkO0FknjjVcu5uOXnPlZDbJ2y8sJ6u8&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_ss=7baaf&oh=00_AQCy3HT7xaZ433Z5jeSqEjKlHVX9xD9HDBmzFnAbNMOOTw&oe=6A4ACBA2">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <style>
        .ec-category-section { margin-bottom: 4rem; }
        .ec-category-title { color: var(--emerald-green); font-size: 1.8rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .ec-scroll-container { display: flex; overflow-x: auto; gap: 2rem; padding-bottom: 1.5rem; scroll-snap-type: x mandatory; }
        .ec-scroll-container::-webkit-scrollbar { height: 8px; }
        .ec-scroll-container::-webkit-scrollbar-thumb { background: var(--emerald-green); border-radius: 4px; }
        .ec-scroll-container::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
        
        .ec-card { 
            flex: 0 0 260px; /* Scaled down width */
            scroll-snap-align: start;
            text-align: center; 
            padding: 2rem 1.5rem; /* Scaled down padding */
            transition: 0.5s; 
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            opacity: 1 !important;
        }
        .ec-card:hover { 
            transform: translateY(-10px); /* Subtle lift */
            border-color: var(--emerald-green);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
        }
        .ec-photo { 
            width: 140px; /* Scaled down photo */
            height: 140px; 
            border-radius: 50%; 
            border: 2px solid var(--emerald-green); 
            margin: 0 auto 1.2rem; 
            overflow: hidden;
            box-shadow: 0 0 15px var(--emerald-green);
            background: #111;
        }
        .ec-photo img { width: 100%; height: 100%; object-fit: cover; }
        .social-links { margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem; }
        .social-links a { 
            color: var(--white); 
            text-decoration: none; 
            font-size: 0.8rem; 
            padding: 5px 12px; 
            border-radius: 20px; 
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }
        .social-links a:hover { background: var(--emerald-green); color: var(--matte-black); border-color: var(--emerald-green); }

        /* Skeleton Animation */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.05) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.05) 75%) !important;
            background-size: 200% 100% !important;
            animation: skeleton-loading 1.5s infinite linear !important;
            border-color: transparent !important;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .ec-photo img {
            width: 100%; height: 100%; object-fit: cover;
            display: block;
        }

        /* Left Side Floating Timeline - High Tech */
        .ec-timeline-container {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 100;
            padding: 2rem 0;
            align-items: center;
        }

        .ec-timeline-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(0, 255, 136, 0.2), transparent);
            transform: translateX(-50%);
            z-index: -1;
        }

        .timeline-item {
            position: relative;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 30px;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--soft-gray);
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            min-width: 90px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .timeline-item:hover {
            border-color: rgba(0, 255, 136, 0.4);
            color: var(--white);
            transform: scale(1.1) translateX(10px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.15);
        }

        .timeline-item:hover::before {
            transform: translateX(100%);
        }

        .timeline-item.active {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 0, 0, 0.8));
            border-color: var(--emerald-green);
            color: var(--emerald-green);
            transform: scale(1.15) translateX(15px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2), inset 0 0 10px rgba(0, 255, 136, 0.1);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .timeline-item.active::after {
            content: '';
            position: absolute;
            left: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: var(--emerald-green);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--emerald-green);
        }

        /* Responsive timeline */
        @media (max-width: 991px) {
            .ec-timeline-container {
                position: sticky;
                top: 75px; 
                left: 0;
                right: 0; 
                transform: none;
                flex-direction: row;
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                background: rgba(10, 10, 10, 0.95);
                padding: 1rem;
                gap: 1rem;
                margin-bottom: 2rem;
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                scroll-snap-type: x mandatory;
            }
            .ec-timeline-container::before { display: none; }
            .timeline-item {
                min-width: 80px;
                padding: 8px 16px;
                scroll-snap-align: center;
                font-size: 0.85rem;
            }
            .timeline-item:hover, .timeline-item.active {
                transform: scale(1.1) translateX(0); /* Disable translateX on mobile */
            }
        }
        /* ── MEMBER MODAL ── */
        #member-modal-overlay {
            display: none;
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #member-modal-overlay.open { display: flex; }

        .mm-wrap {
            background: #0b1a10;
            border: 1px solid rgba(0,245,180,0.18);
            border-radius: 22px;
            width: 100%; max-width: 700px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,245,180,0.06);
            animation: mmIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
            position: relative;
        }
        @keyframes mmIn { from { opacity:0; transform:scale(0.88) translateY(20px); } to { opacity:1; transform:none; } }

        .mm-top-bar { height: 3px; background: linear-gradient(90deg, transparent, #00f5b4, transparent); }

        .mm-close {
            position: absolute; top: 14px; right: 14px;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5); font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; z-index: 10;
        }
        .mm-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .mm-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; padding: 18px 24px 0;
        }
        .mm-club { display: flex; align-items: center; gap: 8px; }
        .mm-club img { width: 30px; height: 30px; border-radius: 6px; }
        .mm-club-name { font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(0,245,180,0.7); line-height: 1.2; }
        .mm-club-name span { color: rgba(255,255,255,0.3); font-weight: 400; display: block; font-size: 0.6rem; }
        .mm-ec-badge { text-align: right; }
        .mm-ec-badge .lbl { font-size: 0.58rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.25); display: block; }
        .mm-ec-badge .yr { font-size: 1.1rem; font-weight: 900; color: #00f5b4; letter-spacing: -0.5px; }

        .mm-body { display: grid; grid-template-columns: 220px 1fr; }

        .mm-photo-col {
            position: relative; overflow: hidden;
            background: rgba(0,245,180,0.02);
            border-right: 1px solid rgba(0,245,180,0.07);
        }
        .mm-photo-wm {
            position: absolute; bottom: 6px; right: 6px;
            font-size: 4rem; font-weight: 900;
            color: rgba(0,245,180,0.04); pointer-events: none; user-select: none;
        }
        .mm-photo { width: 100%; min-height: 280px; max-height: 320px; object-fit: cover; object-position: top; display: block; }
        .mm-photo-ph { width: 100%; height: 280px; display: flex; align-items: center; justify-content: center; font-size: 4rem; font-weight: 900; color: rgba(0,245,180,0.12); }

        .mm-info { padding: 22px 22px 18px; display: flex; flex-direction: column; justify-content: space-between; }

        .mm-name { font-size: 1.55rem; font-weight: 900; color: #fff; letter-spacing: -0.5px; line-height: 1.1; margin-bottom: 4px; }
        .mm-name em { font-style: normal; color: #00f5b4; }
        .mm-role { font-size: 0.8rem; font-weight: 700; color: #00f5b4; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
        .mm-section { font-size: 0.72rem; color: rgba(255,255,255,0.28); font-weight: 500; letter-spacing: 1px; margin-bottom: 18px; }

        .mm-contacts { display: flex; flex-direction: column; gap: 8px; }
        .mm-cr { display: flex; flex-direction: column; gap: 1px; }
        .mm-lbl { font-size: 0.57rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.22); }
        .mm-val { font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.65); }
        .mm-val.blank { color: rgba(255,255,255,0.18); letter-spacing: 1px; }

        .mm-socials { margin-top: 16px; }
        .mm-social-icons { display: flex; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
        .mm-sb {
            width: 34px; height: 34px; border-radius: 9px;
            border: 1px solid rgba(0,245,180,0.14);
            background: rgba(0,245,180,0.04);
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; transition: all 0.22s;
        }
        .mm-sb:hover:not(.dis) { border-color: rgba(0,245,180,0.4); background: rgba(0,245,180,0.1); transform: translateY(-2px); }
        .mm-sb.dis { opacity: 0.2; cursor: default; pointer-events: none; }
        .mm-sb svg { width: 16px; height: 16px; fill: #00f5b4; }

        /* QR section */
        .mm-qr-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 24px; border-top: 1px solid rgba(0,245,180,0.07);
        }
        .mm-qr-canvas { border-radius: 8px; background: #fff; padding: 4px; }
        .mm-qr-text { font-size: 0.72rem; color: rgba(255,255,255,0.3); line-height: 1.6; }
        .mm-qr-text strong { color: rgba(255,255,255,0.6); display: block; font-size: 0.8rem; margin-bottom: 2px; }

        .mm-footer {
            padding: 10px 24px;
            border-top: 1px solid rgba(0,245,180,0.07);
            display: flex; align-items: center; justify-content: space-between;
        }
        .mm-footer-tag { font-size: 0.6rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.15); }

        /* Cursor pointer on ec cards */
        .ec-card { cursor: pointer; }

        /* ── MOBILE MODAL ── */
        @media (max-width: 600px) {
            .mm-body { grid-template-columns: 1fr; }
            .mm-photo-col { border-right: none; border-bottom: 1px solid rgba(0,245,180,0.07); max-height: 220px; }
            .mm-photo { max-height: 220px; min-height: unset; }
            .mm-photo-ph { height: 180px; }
            .mm-info { padding: 16px 18px 14px; }
            .mm-name { font-size: 1.25rem; }
            .mm-qr-row { padding: 12px 18px; }
            .mm-footer { padding: 10px 18px; }
            .mm-header { padding: 14px 18px 0; }
        }
    </style>
</head>
<body>
    <div class="futuristic-grid"></div>
    <div class="cursor-glow" id="cursor-glow"></div>

    <!-- MEMBER MODAL -->
    <div id="member-modal-overlay" onclick="closeModal(event)">
        <div class="mm-wrap" id="mm-wrap">
            <div class="mm-top-bar"></div>
            <div id="mm-content"></div>
        </div>
    </div>

    {% include 'components/navbar.html' %}

    <header class="page-header">
        <div class="container">
            <h1 class="hero-title">Executive Committee</h1>
            <p class="hero-subtitle">The visionaries leading MPSC IT CLUB towards excellence.</p>
        </div>
    </header>

    <div class="ec-timeline-container" id="ec-timeline">
        <!-- Dots loaded dynamically -->
    </div>

    <section class="ec-section" style="padding-top: 4rem; padding-bottom: 5rem;">
        <div class="container">
            <div id="ec-container">
                <!-- Data loaded via API -->
            </div>
        </div>
    </section>

    {% include 'components/footer.html' %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/circularMenu.js') }}"></script>
    <script>
        let globalYearsMap = {};
        let globalCategories = { 
            BVB: 'Bangla Version Boys (BVB)', 
            BVG: 'Bangla Version Girls (BVG)', 
            EVB: 'English Version Boys (EVB)', 
            EVG: 'English Version Girls (EVG)' 
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('ec-container');
            
            container.innerHTML = `
                <div class="ec-category-section">
                    <h2 class="ec-category-title skeleton" style="width: 300px; height: 35px; border: none; border-radius: 4px;"></h2>
                    <div class="ec-scroll-container">
                        ${Array(4).fill('<div class="glass-card ec-card skeleton" style="height: 400px; border-radius: 16px;"></div>').join('')}
                    </div>
                </div>
            `;

            try {
                const res = await fetch('/user/ec_list');
                const members = await res.json();

                if (!members || members.length === 0) {
                    container.innerHTML = '<p>The committee list is being updated.</p>';
                    return;
                }

                members.forEach(m => {
                    const yr = m.year || '2026';
                    if (!globalYearsMap[yr]) globalYearsMap[yr] = [];
                    globalYearsMap[yr].push(m);
                });

                const sortedYears = Object.keys(globalYearsMap).sort((a, b) => b - a);

                const timeline = document.getElementById('ec-timeline');
                if (timeline) {
                    timeline.innerHTML = sortedYears.map((yr, idx) => `
                        <div class="timeline-item ${idx === 0 ? 'active' : ''}" data-year="${yr}" onclick="loadYear('${yr}')">
                            ${yr}
                        </div>
                    `).join('');
                }

                if (sortedYears.length > 0) loadYear(sortedYears[0]);
            } catch (err) {
                console.error("Error fetching EC List:", err);
                container.innerHTML = '<p>Failed to load committee members. Please try again later.</p>';
            }
        });

        window.loadYear = (year) => {
            const container = document.getElementById('ec-container');
            const yrMembers = globalYearsMap[year];
            if (!yrMembers) return;

            document.querySelectorAll('.timeline-item').forEach(dot => {
                dot.classList.toggle('active', dot.getAttribute('data-year') === String(year));
            });

            const grouped = { BVB: [], BVG: [], EVB: [], EVG: [] };
            yrMembers.forEach(m => { if (grouped[m.category]) grouped[m.category].push(m); });

            let yearHtml = `
                <div class="ec-year-section" id="year-section-${year}" style="margin-bottom: 6rem; position: relative;">
                    <h2 class="year-heading" style="font-size: 2.8rem; color: var(--emerald-green); text-align: center; margin-bottom: 3rem; font-weight: 700; letter-spacing: 3px; text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);"><span style="color:var(--white);">Committee of</span> ${year}</h2>
            `;

            for (const [key, title] of Object.entries(globalCategories)) {
                if (grouped[key].length > 0) {
                    yearHtml += `
                        <div class="ec-category-section">
                            <h3 class="ec-category-title">${title}</h3>
                            <div class="ec-scroll-container">
                                ${grouped[key].map(m => `
                                    <div class="glass-card ec-card" onclick="openMemberModal(${JSON.stringify(m).replace(/"/g, '&quot;')})">
                                        <div class="ec-photo">
                                            <img src="${m.image_path || '/static/assets/images/ec/default.jpg'}" alt="${m.name}"
                                                 onerror="this.src='/static/assets/images/ec/default.jpg'">
                                        </div>
                                        <h3 class="emerald" style="text-transform: uppercase; letter-spacing: 2px;">${m.name}</h3>
                                        <p class="role" style="color: var(--soft-gray); font-weight: 600;">${m.designation}</p>
                                        <p style="font-size:0.72rem; color:rgba(255,255,255,0.25); margin-top:0.5rem; letter-spacing:1px;">TAP TO VIEW CARD</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }
            yearHtml += `</div>`;
            container.innerHTML = yearHtml;

            gsap.from('.ec-year-section', { opacity: 0, y: 50, duration: 0.8, ease: "power3.out", clearProps: "all" });
            gsap.from('.ec-card', { opacity: 0, scale: 0.9, y: 30, stagger: 0.1, duration: 0.6, ease: "back.out(1.7)", clearProps: "all" });
        };

        // ── MODAL ──────────────────────────────────
        function openMemberModal(m) {
            const overlay = document.getElementById('member-modal-overlay');
            const content = document.getElementById('mm-content');

            const nameParts = (m.name || '').trim().split(' ');
            const first = nameParts[0] || '';
            const last = nameParts.slice(1).join(' ') || '';
            const yr = m.year || '2026';
            const nextYr = parseInt(yr) + 1;
            const cardUrl = `${location.origin}/member/${m.id}`;

            const catLabels = { BVB:'Bangla Version · Boys', BVG:'Bangla Version · Girls', EVB:'English Version · Boys', EVG:'English Version · Girls' };
            const catLabel = catLabels[m.category] || m.category || 'MPSC IT Club';

            const phone = m.whatsapp ? '+' + m.whatsapp.replace('+','') : null;
            const waLink = m.whatsapp ? 'https://wa.me/' + m.whatsapp.replace(/[^0-9]/g,'') : null;

            content.innerHTML = `
                <div class="mm-header">
                    <div class="mm-club">
                        <img src="https://college.mpsc.edu.bd/storage/clubs/logos/gM73rp2FRf0ZTUr3IjUC5fsbe2SLVqK5JF481hBB.jpg" alt="MPSC IT Club" onerror="this.style.display='none'">
                        <div class="mm-club-name">MPSC IT Club<span>Mohammadpur Preparatory</span></div>
                    </div>
                    <div class="mm-ec-badge">
                        <span class="lbl">Executive Committee</span>
                        <span class="yr">${yr}–${nextYr}</span>
                    </div>
                </div>

                <div class="mm-body">
                    <div class="mm-photo-col">
                        <div class="mm-photo-wm">IT</div>
                        ${m.image_path && m.image_path !== '/static/assets/images/ec/default.jpg'
                            ? `<img src="${m.image_path}" alt="${m.name}" class="mm-photo" onerror="this.parentElement.innerHTML='<div class=mm-photo-ph>${first[0] || '?'}</div>'">`
                            : `<div class="mm-photo-ph">${first[0] || '?'}</div>`
                        }
                    </div>
                    <div class="mm-info">
                        <div>
                            <div class="mm-name">${first} <em>${last}</em></div>
                            <div class="mm-role">${m.designation || ''}</div>
                            <div class="mm-section">${catLabel}</div>

                            <div class="mm-contacts">
                                <div class="mm-cr">
                                    <span class="mm-lbl">Mobile No.</span>
                                    <span class="mm-val ${phone ? '' : 'blank'}">${phone || '+8801xxxxxxxxx'}</span>
                                </div>
                                ${m.email ? `<div class="mm-cr"><span class="mm-lbl">E-mail</span><span class="mm-val">${m.email}</span></div>` : ''}
                            </div>

                            <div class="mm-socials">
                                <span class="mm-lbl">Socials</span>
                                <div class="mm-social-icons">
                                    <a href="${m.facebook || '#'}" ${m.facebook ? 'target="_blank"' : ''} class="mm-sb ${m.facebook ? '' : 'dis'}" title="Facebook">
                                        <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                                    </a>
                                    <a href="${m.instagram || '#'}" ${m.instagram ? 'target="_blank"' : ''} class="mm-sb ${m.instagram ? '' : 'dis'}" title="Instagram">
